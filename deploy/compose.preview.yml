name: anniti-smart-preview

services:
  preview:
    image: "anniti-smart-preview:${ANNITI_BUILD_ID:-local}"
    build:
      context: "${ANNITI_RELEASE_PATH:?ANNITI_RELEASE_PATH must point to an immutable release}"
      dockerfile: Dockerfile
    container_name: anniti-smart-preview
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3086
      BUILD_ID: "${ANNITI_BUILD_ID:-local}"
      SUBMISSIONS_FILE: /var/lib/anniti-smart-preview/submissions/test-submissions.jsonl
      RATE_LIMIT_WINDOW_MS: "${ANNITI_RATE_LIMIT_WINDOW_MS:-600000}"
      RATE_LIMIT_MAX: "${ANNITI_RATE_LIMIT_MAX:-5}"
      IDEMPOTENCY_TTL_MS: "${ANNITI_IDEMPOTENCY_TTL_MS:-86400000}"
    ports:
      - "127.0.0.1:${ANNITI_HOST_PORT:-3086}:3086"
    volumes:
      - type: bind
        source: "${ANNITI_SUBMISSIONS_DIR:-/var/lib/anniti-smart-preview/submissions}"
        target: /var/lib/anniti-smart-preview/submissions
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3086/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s
